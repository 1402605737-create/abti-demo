﻿<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ABTI · A+B 极速人格测试</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #08060c;
      --panel: rgba(20, 14, 28, 0.88);
      --panel-soft: rgba(33, 24, 44, 0.86);
      --line: rgba(229, 186, 108, 0.16);
      --gold: #e5ba6c;
      --pink: #ff6f91;
      --violet: #9a7dff;
      --cyan: #73def5;
      --text: #f7efe6;
      --muted: rgba(247, 239, 230, 0.66);
      --danger: #ff8b8b;
      --success: #7fdda4;
      --shadow: 0 24px 80px rgba(0, 0, 0, 0.42);
      --radius-xl: 28px;
      --radius-lg: 22px;
      --radius-md: 16px;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(circle at 12% 8%, rgba(154, 125, 255, 0.18), transparent 24%),
        radial-gradient(circle at 86% 16%, rgba(255, 111, 145, 0.16), transparent 22%),
        radial-gradient(circle at 50% 100%, rgba(229, 186, 108, 0.08), transparent 30%),
        linear-gradient(180deg, #0a0710, #120d18 55%, #09070d);
      color: var(--text);
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 28px 28px;
      mask-image: linear-gradient(180deg, rgba(0,0,0,0.36), transparent 100%);
    }

    button, input { font: inherit; }
    button { cursor: pointer; }
    pre {
      margin: 0;
      white-space: pre-wrap;
      word-break: break-word;
      font-family: "Cascadia Code", Consolas, monospace;
      font-size: 12px;
      line-height: 1.65;
    }

    .shell {
      height: 100vh;
      min-height: 100dvh;
      display: grid;
      grid-template-columns: 224px minmax(0, 1fr) 320px;
      gap: 18px;
      padding: 18px;
    }

    .glass {
      background: linear-gradient(180deg, rgba(18, 12, 26, 0.96), rgba(14, 10, 22, 0.92));
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
    }

    .sidebar, .main, .rail { min-height: 0; border-radius: 28px; }

    .sidebar {
      padding: 22px 18px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      position: relative;
      overflow: hidden;
    }

    .sidebar::before {
      content: "";
      position: absolute;
      top: -44px;
      right: -34px;
      width: 148px;
      height: 148px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,111,145,0.22), rgba(255,111,145,0));
      pointer-events: none;
    }

    .eyebrow {
      margin: 0;
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--gold);
    }

    .brand h1, .hero h3, .code-big, .video-caption, .section-number {
      margin: 0;
      font-family: "Baskerville Old Face", "Times New Roman", "STSong", serif;
      letter-spacing: 0.02em;
    }

    .brand h1 {
      margin-top: 8px;
      font-size: 42px;
      line-height: 0.92;
    }

    .desc, .tiny, .meta { color: var(--muted); }
    .desc { margin: 0; line-height: 1.75; }
    .tiny { font-size: 12px; line-height: 1.65; }
    .meta { font-size: 14px; line-height: 1.65; }

    .nav-list { display: grid; gap: 8px; }

    .nav-item {
      width: 100%;
      padding: 14px 16px;
      text-align: left;
      border-radius: 18px;
      border: 1px solid transparent;
      background: rgba(255,255,255,0.03);
      color: var(--text);
      transition: 180ms ease;
    }

    .nav-item strong { display: block; font-size: 15px; }
    .nav-item span { font-size: 12px; color: var(--muted); }
    .nav-item:hover { transform: translateY(-1px); background: rgba(255,255,255,0.06); }
    .nav-item.active {
      background: linear-gradient(135deg, rgba(229,186,108,0.12), rgba(154,125,255,0.14));
      border-color: rgba(229,186,108,0.24);
    }

    .sidebar-card, .panel, .rail-card, .stat-card, .scene-card, .json-card, .step-card, .atlas-card {
      padding: 16px;
      border-radius: 20px;
      border: 1px solid rgba(229, 186, 108, 0.12);
      background: rgba(255,255,255,0.03);
    }

    .primary-btn, .action-btn.primary {
      border: 0;
      color: #180d0f;
      background: linear-gradient(135deg, var(--gold), #f0cf8f);
      box-shadow: 0 16px 28px rgba(229, 186, 108, 0.16);
      font-weight: 700;
    }

    .primary-btn { min-height: 48px; border-radius: 18px; }

    .main {
      display: flex;
      flex-direction: column;
      min-width: 0;
      overflow: hidden;
    }

    .topbar {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 16px;
      align-items: center;
      padding: 18px 22px 14px;
      border-bottom: 1px solid var(--line);
      background: rgba(8, 6, 12, 0.44);
    }

    .topbar h2 {
      margin: 6px 0 0;
      font-size: 30px;
    }

    .status-pill, .ghost-btn, .chip, .choice-chip, .action-btn, .mini-tag {
      min-height: 40px;
      padding: 0 14px;
      border-radius: 999px;
      border: 1px solid rgba(229, 186, 108, 0.16);
      background: rgba(255,255,255,0.04);
      color: var(--text);
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .status-pill {
      min-height: 48px;
      max-width: 100%;
      flex-wrap: wrap;
    }
    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 0 6px rgba(127,221,164,0.12);
    }
    .status-dot.error {
      background: var(--danger);
      box-shadow: 0 0 0 6px rgba(255,139,139,0.12);
    }

    .scroll {
      flex: 1;
      overflow: auto;
      padding: 22px;
    }

    .page { display: none; animation: fadeUp 220ms ease; }
    .page.active { display: block; }
    .stack { display: grid; gap: 18px; }

    .hero {
      padding: 24px;
      border-radius: var(--radius-xl);
      border: 1px solid rgba(229, 186, 108, 0.14);
      background:
        radial-gradient(circle at top right, rgba(255,111,145,0.16), transparent 26%),
        linear-gradient(135deg, rgba(24, 17, 34, 0.98), rgba(14, 10, 22, 0.92));
      display: grid;
      gap: 16px;
    }

    .hero h3 {
      font-size: clamp(32px, 4vw, 58px);
      line-height: 1.02;
    }

    .hero-row, .chip-row, .action-row, .pick-row, .mini-row { display: flex; flex-wrap: wrap; gap: 10px; }

    .quick-grid, .result-grid, .studio-grid, .stats-grid, .atlas-grid {
      display: grid;
      gap: 18px;
    }

    .quick-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .result-grid { grid-template-columns: minmax(320px, 420px) minmax(0, 1fr); }
    .studio-grid { grid-template-columns: minmax(320px, 400px) minmax(0, 1fr); }
    .stats-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .atlas-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }

    .pick-panel {
      padding: 18px;
      border-radius: 24px;
      border: 1px solid rgba(229, 186, 108, 0.14);
      background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.02));
      display: grid;
      gap: 14px;
      align-content: start;
    }

    .pick-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .section-number {
      font-size: 58px;
      line-height: 0.9;
      color: var(--gold);
    }

    .quick-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .quick-chip {
      min-height: 46px;
      padding: 0 16px;
      border-radius: 999px;
      border: 1px solid rgba(229, 186, 108, 0.14);
      background: rgba(255,255,255,0.04);
      color: var(--text);
      transition: 160ms ease;
    }

    .quick-chip:hover { transform: translateY(-1px); }
    .quick-chip.active {
      border-color: rgba(229, 186, 108, 0.38);
      background: linear-gradient(135deg, rgba(229,186,108,0.14), rgba(154,125,255,0.14));
      box-shadow: 0 10px 24px rgba(0,0,0,0.18);
    }

    .counter {
      padding: 0 12px;
      min-height: 32px;
      border-radius: 999px;
      background: rgba(229,186,108,0.1);
      color: var(--gold);
      display: inline-flex;
      align-items: center;
      font-size: 12px;
    }

    .summary-bar {
      padding: 18px;
      border-radius: 22px;
      border: 1px solid rgba(229,186,108,0.16);
      background:
        linear-gradient(135deg, rgba(154,125,255,0.12), rgba(255,111,145,0.08));
      display: grid;
      gap: 12px;
    }

    .video-shell {
      position: relative;
      aspect-ratio: 9 / 16;
      max-height: 760px;
      border-radius: 28px;
      overflow: hidden;
      border: 1px solid rgba(229, 186, 108, 0.18);
      background:
        radial-gradient(circle at top, rgba(154,125,255,0.18), transparent 34%),
        radial-gradient(circle at bottom, rgba(255,111,145,0.16), transparent 28%),
        linear-gradient(180deg, #16101f, #0d0915 60%, #120c19);
      box-shadow: 0 26px 60px rgba(0,0,0,0.34);
    }

    .video-overlay {
      position: absolute;
      inset: 0;
      padding: 18px;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 14px;
      background: linear-gradient(180deg, rgba(0,0,0,0.22), rgba(0,0,0,0.08) 38%, rgba(0,0,0,0.58));
    }

    .progress-row {
      display: grid;
      grid-template-columns: repeat(var(--scene-count, 4), minmax(0, 1fr));
      gap: 8px;
    }

    .progress-row span {
      height: 4px;
      border-radius: 999px;
      background: rgba(255,255,255,0.18);
      overflow: hidden;
      position: relative;
      cursor: pointer;
      transition: opacity 160ms ease, transform 160ms ease;
    }

    .progress-row span:hover {
      opacity: 0.96;
      transform: scaleY(1.16);
    }

    .progress-row span.active::after,
    .progress-row span.done::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, var(--gold), #fff0c8);
    }

    .video-top {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
    }

    .code-big {
      font-size: clamp(62px, 8vw, 110px);
      line-height: 0.9;
      color: var(--gold);
    }

    .video-body {
      display: grid;
      align-content: center;
      gap: 16px;
      transition: opacity 180ms ease, transform 180ms ease;
    }

    .video-body.updating {
      opacity: 0.18;
      transform: translateY(10px);
    }

    .video-caption {
      font-size: clamp(28px, 4vw, 54px);
      line-height: 1.02;
    }

    .video-sub {
      font-size: 16px;
      line-height: 1.8;
      color: rgba(255,255,255,0.82);
      max-width: 92%;
    }

    .video-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .video-tag {
      min-height: 34px;
      padding: 0 12px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.06);
      color: #fff3dd;
      display: inline-flex;
      align-items: center;
      font-size: 12px;
    }

    .video-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    .video-btn {
      min-height: 36px;
      padding: 0 14px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.14);
      background: rgba(255,255,255,0.06);
      color: var(--text);
    }

    .scene-meter {
      min-height: 36px;
      padding: 0 12px;
      border-radius: 999px;
      background: rgba(229,186,108,0.1);
      color: var(--gold);
      display: inline-flex;
      align-items: center;
      font-size: 12px;
    }

    .result-side {
      display: grid;
      gap: 16px;
      align-content: start;
    }

    .portrait-panel, .narrative-card {
      display: grid;
      gap: 14px;
      align-content: start;
    }

    .portrait-frame {
      position: relative;
      overflow: hidden;
      border-radius: 24px;
      border: 1px solid rgba(229, 186, 108, 0.16);
      background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.02));
      min-height: 520px;
    }

    .frame-bloom {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 18% 18%, rgba(255,255,255,0.16), transparent 34%),
        linear-gradient(180deg, transparent 30%, rgba(11,9,16,0.2) 72%, rgba(11,9,16,0.6) 100%);
      mix-blend-mode: screen;
      opacity: 0.9;
    }

    .faction-sigil {
      position: absolute;
      top: 18px;
      right: 18px;
      min-height: 34px;
      padding: 0 14px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      z-index: 2;
      border: 1px solid rgba(255,255,255,0.14);
      background: rgba(12,10,18,0.4);
      backdrop-filter: blur(8px);
      color: #fff2db;
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .portrait-image {
      width: 100%;
      height: 100%;
      min-height: 520px;
      object-fit: cover;
      display: block;
      background: rgba(255,255,255,0.03);
      transform: scale(1.02);
      transition: transform 360ms ease, filter 360ms ease;
    }

    .portrait-note {
      padding: 14px 16px;
      border-radius: 18px;
      border: 1px solid rgba(229,186,108,0.12);
      background: rgba(255,255,255,0.03);
      color: rgba(255,255,255,0.82);
      line-height: 1.8;
      font-size: 14px;
    }

    .thumb-frame {
      position: relative;
      overflow: hidden;
      border-radius: 18px;
      border: 1px solid rgba(229,186,108,0.14);
      background: rgba(255,255,255,0.03);
      margin-top: 12px;
    }

    .thumb-image {
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      display: block;
      background: rgba(255,255,255,0.03);
      transition: transform 280ms ease, filter 280ms ease;
    }

    .thumb-glow {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.08), transparent 38%),
        linear-gradient(180deg, transparent 42%, rgba(11,9,16,0.18) 72%, rgba(11,9,16,0.58) 100%);
      pointer-events: none;
    }

    .faction-chip {
      min-height: 28px;
      padding: 0 12px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      border: 1px solid rgba(255,255,255,0.14);
      background: rgba(255,255,255,0.06);
      color: #fff2db;
    }

    .faction-note {
      color: rgba(255,255,255,0.66);
      font-size: 12px;
      line-height: 1.7;
    }

    .cover-hook {
      margin: 2px 0 0;
      font-size: 14px;
      line-height: 1.8;
      color: #ffdbe8;
    }

    .danger-line {
      padding: 12px 14px;
      border-radius: 16px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      color: rgba(255,255,255,0.86);
      font-size: 13px;
      line-height: 1.8;
    }

    .story-copy {
      margin: 0;
      line-height: 1.92;
      color: rgba(255,255,255,0.84);
      font-size: 15px;
    }

    .verdict-quote {
      padding: 18px 20px;
      border-radius: 22px;
      background: linear-gradient(135deg, rgba(229,186,108,0.14), rgba(255,111,145,0.1));
      border: 1px solid rgba(229,186,108,0.18);
      color: #fff1df;
      font-size: 18px;
      line-height: 1.8;
    }

    .headline {
      font-size: 18px;
      line-height: 1.8;
      color: #ffd7e4;
    }

    .stat-card strong, .scene-card strong, .rail-card h4, .step-card strong {
      display: block;
      font-size: 16px;
      margin-bottom: 6px;
    }

    .scene-list, .step-list, .field-stack, .rail-list { display: grid; gap: 12px; }

    .atlas-card {
      min-height: 210px;
      text-align: left;
      transition: 220ms ease;
    }

    .atlas-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 24px 64px rgba(0,0,0,0.34);
    }

    .atlas-card:hover .thumb-image {
      transform: scale(1.06);
      filter: saturate(1.08);
    }

    .portrait-frame:hover .portrait-image {
      transform: scale(1.04);
      filter: saturate(1.06);
    }

    .atlas-card.active { border-color: rgba(229,186,108,0.34); }

    .faction-AB {
      border-color: rgba(216,176,106,0.28);
      box-shadow: inset 0 0 0 1px rgba(216,176,106,0.06), 0 18px 50px rgba(120,81,255,0.12);
    }

    .faction-AS {
      border-color: rgba(141,167,255,0.28);
      box-shadow: inset 0 0 0 1px rgba(141,167,255,0.06), 0 18px 50px rgba(93,135,255,0.12);
    }

    .faction-VB {
      border-color: rgba(255,122,122,0.28);
      box-shadow: inset 0 0 0 1px rgba(255,122,122,0.06), 0 18px 50px rgba(255,79,163,0.12);
    }

    .faction-VS {
      border-color: rgba(236,180,164,0.28);
      box-shadow: inset 0 0 0 1px rgba(236,180,164,0.06), 0 18px 50px rgba(176,98,143,0.12);
    }

    .portrait-frame.faction-AB .frame-bloom {
      animation: abPulse 6.4s ease-in-out infinite;
    }

    .portrait-frame.faction-AS .frame-bloom {
      animation: asScan 5.8s linear infinite;
    }

    .portrait-frame.faction-VB .frame-bloom {
      animation: vbFlicker 2.8s ease-in-out infinite;
    }

    .portrait-frame.faction-VS .frame-bloom {
      animation: vsMist 7.2s ease-in-out infinite;
    }

    .portrait-frame.faction-AB .portrait-image {
      animation: revealFloat 7s ease-in-out infinite;
    }

    .portrait-frame.faction-AS .portrait-image {
      animation: revealDrift 8.4s ease-in-out infinite;
    }

    .portrait-frame.faction-VB .portrait-image {
      animation: revealRush 3.2s ease-in-out infinite;
    }

    .portrait-frame.faction-VS .portrait-image {
      animation: revealSway 9s ease-in-out infinite;
    }

    @keyframes abPulse {
      0%, 100% { opacity: 0.72; transform: translate3d(0, 0, 0) scale(1); }
      50% { opacity: 1; transform: translate3d(-8px, 6px, 0) scale(1.04); }
    }

    @keyframes asScan {
      0% { opacity: 0.3; transform: translateY(-12px); }
      50% { opacity: 0.88; transform: translateY(10px); }
      100% { opacity: 0.3; transform: translateY(-12px); }
    }

    @keyframes vbFlicker {
      0%, 100% { opacity: 0.56; transform: scale(1); }
      24% { opacity: 0.98; transform: scale(1.03); }
      48% { opacity: 0.42; transform: scale(0.99); }
      72% { opacity: 0.92; transform: scale(1.05); }
    }

    @keyframes vsMist {
      0%, 100% { opacity: 0.64; transform: translateX(0) translateY(0); }
      50% { opacity: 0.96; transform: translateX(10px) translateY(-8px); }
    }

    @keyframes revealFloat {
      0%, 100% { transform: scale(1.02) translateY(0); }
      50% { transform: scale(1.045) translateY(-6px); }
    }

    @keyframes revealDrift {
      0%, 100% { transform: scale(1.02) translateX(0); }
      50% { transform: scale(1.04) translateX(-8px); }
    }

    @keyframes revealRush {
      0%, 100% { transform: scale(1.03) translateX(0); filter: saturate(1); }
      50% { transform: scale(1.055) translateX(8px); filter: saturate(1.12); }
    }

    @keyframes revealSway {
      0%, 100% { transform: scale(1.02) translateY(0) translateX(0); }
      50% { transform: scale(1.04) translateY(-4px) translateX(6px); }
    }

    .atlas-code {
      font-family: "Baskerville Old Face", "Times New Roman", serif;
      font-size: 36px;
      color: var(--gold);
      margin: 8px 0 12px;
    }

    .field label {
      display: block;
      margin-bottom: 8px;
      color: var(--gold);
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .input-shell { position: relative; }
    .input-shell input, .json-box {
      width: 100%;
      border-radius: 16px;
      border: 1px solid rgba(229,186,108,0.16);
      background: rgba(255,255,255,0.04);
      color: var(--text);
    }

    .input-shell input {
      padding: 14px 16px;
      outline: none;
    }

    .input-shell input:focus {
      border-color: rgba(229,186,108,0.38);
      box-shadow: 0 0 0 4px rgba(229,186,108,0.08);
    }

    .toggle-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 34px;
      height: 34px;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: var(--muted);
    }

    .action-grid {
      display: grid;

      function loadState() {
        const next = getDefaultState();
        const savedConfig = readStorage(STORAGE_KEYS.config);
        const savedUI = readStorage(STORAGE_KEYS.ui);
        const savedResult = readStorage(STORAGE_KEYS.result);
        const savedHistory = readStorage(STORAGE_KEYS.history);
        if (savedConfig) next.apiConfig = savedConfig;
        if (savedUI) {
          next.aSelected = Array.isArray(savedUI.aSelected) ? savedUI.aSelected : next.aSelected;
          next.bSelected = Array.isArray(savedUI.bSelected) ? savedUI.bSelected : next.bSelected;
          next.currentId = savedUI.currentId || next.currentId;
        }
        if (savedResult) next.result = savedResult;
        if (Array.isArray(savedHistory)) next.history = savedHistory;
        return next;
      }

      function readStorage(key) {
        try {
          const raw = localStorage.getItem(key);
          return raw ? JSON.parse(raw) : null;
        } catch {
          return null;
        }
      }

      function persist() {
        localStorage.setItem(STORAGE_KEYS.config, JSON.stringify(state.apiConfig));
        localStorage.setItem(STORAGE_KEYS.ui, JSON.stringify({
          aSelected: state.aSelected,
          bSelected: state.bSelected,
          currentId: state.currentId
        }));
        localStorage.setItem(STORAGE_KEYS.result, JSON.stringify(state.result));
        localStorage.setItem(STORAGE_KEYS.history, JSON.stringify(state.history));
      }

      function ensureRoute() {
        const values = Object.values(ROUTES);
        if (!values.includes(window.location.hash)) window.location.hash = ROUTES.quick;
        state.route = window.location.hash || ROUTES.quick;
      }

      function getRecords() {
        return state.history.concat(SAMPLE_RECORDS).map(hydrateRecord);

      function getAtlasRecords() {
        const unique = new Map();
        getRecords().forEach(record => {
          if (!record || !record.abti || !record.abti.code) return;
          if (!unique.has(record.abti.code)) unique.set(record.abti.code, record);
        });
        return Array.from(unique.values());
      }

      function getCurrentRecord() {
        const records = getRecords();
        return records.find(item => item.id === state.currentId) || records[0];
      }

      function renderLogs() {
        return state.stepLogs.map(item => {
          const tail = item.durationMs ? item.durationMs + " ms" : item.status;
          return `<div class="step-card ${item.status}"><strong>${getStepLabel(item.step)}</strong><div class="tiny">${escapeHtml(item.message)}</div><div class="tiny">${escapeHtml(tail)}</div></div>`;
        }).join("");
      }

      function handleClick(event) {
        const target = event.target.closest("[data-action]");
        if (!target) return;
        const action = target.getAttribute("data-action");

        if (action === "navigate") {
          window.location.hash = target.getAttribute("data-route");
          return;
        }

        if (action === "toggle-a") {
          toggleKeyword("a", target.getAttribute("data-value"));
          return;
        }

        if (action === "toggle-b") {
          toggleKeyword("b", target.getAttribute("data-value"));
          return;
        }

        if (action === "random-both") {
          state.aSelected = shuffle(A_KEYWORDS.map(item => item.label)).slice(0, 3);
          state.bSelected = shuffle(B_KEYWORDS.map(item => item.label)).slice(0, 3);
          renderApp();
          showToast("已随机配好 A+B 组合");
          return;
        }

        if (action === "random-a") {
          fillRandomSide("a");
          return;
        }

        if (action === "random-b") {
          fillRandomSide("b");
          return;
        }

        if (action === "clear-all") {
          state.aSelected = [];
          state.bSelected = [];
          renderApp();
          return;
        }

        if (action === "generate-now") {
          runFlow();
          return;
        }

        if (action === "prev-scene") {
          shiftScene(-1);
          return;
        }

        if (action === "next-scene") {
          shiftScene(1);
          return;
        }

        if (action === "jump-scene") {
          jumpScene(Number(target.getAttribute("data-index")));
          return;
        }

        if (action === "open-record") {
          state.currentId = target.getAttribute("data-id");
          state.sceneIndex = 0;
          window.location.hash = ROUTES.reveal;
          renderApp();
          return;
        }

        if (action === "toggle-key") {
          state.showApiKey = !state.showApiKey;
          renderApp();
          return;
        }

        if (action === "copy-current") {
          copyCurrent();
        }
      }

      function handleInput(event) {
        if (!(event.target instanceof HTMLInputElement)) return;
        const id = event.target.id;
        if (id === "baseUrlInput") state.apiConfig.baseUrl = event.target.value;
        if (id === "modelInput") state.apiConfig.model = event.target.value;
        if (id === "apiKeyInput") state.apiConfig.apiKey = event.target.value;
        if (id === "tempParseInput") state.apiConfig.temperatureParse = Number(event.target.value);
        if (id === "tempAbtiInput") state.apiConfig.temperatureAbti = Number(event.target.value);
        if (id === "tempVideoInput") state.apiConfig.temperatureVideo = Number(event.target.value);
        persist();
      }

      function toggleKeyword(side, value) {
        const key = side === "a" ? "aSelected" : "bSelected";
        const list = state[key];
        if (list.includes(value)) state[key] = list.filter(item => item !== value);
        else if (list.length < 3) state[key] = list.concat(value);
        else showToast("每边最多选 3 个词");
        renderApp();
      }

      function fillRandomSide(side) {
        const pool = side === "a" ? A_KEYWORDS : B_KEYWORDS;
        const key = side === "a" ? "aSelected" : "bSelected";
        state[key] = shuffle(pool.map(item => item.label)).slice(0, 3);
        renderApp();
        showToast((side === "a" ? "A" : "B") + " 面已命运代抽");
      }

      function canGenerate() {
        return state.aSelected.length === 3 && state.bSelected.length === 3;
      }

      function getStepLabel(step) {
        if (step === "parse") return "A+B 解析";
        if (step === "abti") return "ABTI 判定";
        if (step === "video") return "画像补刀";
        return "待命中";
      }

      function updateLog(step, patch) {
        state.stepLogs = state.stepLogs.map(item => item.step === step ? { ...item, ...patch } : item);
      }

      function resetRuntime() {
        state.status = "idle";
        state.activeStep = "";
        state.errorMessage = "";
        state.stepLogs = getFreshLogs();
      }

      async function runFlow() {
        if (!canGenerate()) {
          state.status = "error";
          state.errorMessage = "A 组和 B 组都必须各选满 3 个关键词";
          renderApp();
          return;
        }

        if (!state.apiConfig.apiKey.trim()) {
          const localRecord = synthesizeLocalRecord(state.aSelected, state.bSelected);
          commitRecord(localRecord);
          state.status = "success";
          state.sceneIndex = 0;
          window.location.hash = ROUTES.reveal;
          renderApp();
          showToast("已使用本地极速模式生成");
          return;
        }

        resetRuntime();
        state.status = "running";
        renderApp();

        try {
          state.activeStep = "parse";
          updateLog("parse", { status: "running", message: "正在拆解 A+B 组合的坏心眼结构" });
          renderApp();
          const parseStart = performance.now();
          const parseResponse = await requestStructuredJson(buildParseMessages(), state.apiConfig.temperatureParse);
          if (!hasParseShape(parseResponse.parsed)) throw new Error("解析结果缺少必要字段");
          state.result.parseResult = parseResponse.parsed;
          state.result.rawResponses.parse = parseResponse.rawText;
          updateLog("parse", { status: "success", durationMs: Math.round(performance.now() - parseStart), message: "A+B 组合结构已拆完" });

          state.activeStep = "abti";
          updateLog("abti", { status: "running", message: "正在写最难听也最像的一句" });
          renderApp();
          const abtiStart = performance.now();
          const abtiResponse = await requestStructuredJson(buildAbtiMessages(state.result.parseResult), state.apiConfig.temperatureAbti);
          if (!hasAbtiShape(abtiResponse.parsed)) throw new Error("ABTI 结果缺少必要字段");
          state.result.abtiResult = abtiResponse.parsed;
          state.result.rawResponses.abti = abtiResponse.rawText;
          updateLog("abti", { status: "success", durationMs: Math.round(performance.now() - abtiStart), message: "ABTI 标题和狠话已写好" });

          state.activeStep = "video";
          updateLog("video", { status: "running", message: "正在生成画像和补刀区" });
          renderApp();
          const videoStart = performance.now();
          const profileResponse = await requestStructuredJson(buildVideoMessages(state.result.parseResult, state.result.abtiResult), state.apiConfig.temperatureVideo);
          if (!hasVideoShape(profileResponse.parsed)) throw new Error("画像结果缺少必要字段");
          state.result.profileResult = profileResponse.parsed.profile;
          state.result.videoResult = profileResponse.parsed.video;
          state.result.rawResponses.video = profileResponse.rawText;
          updateLog("video", { status: "success", durationMs: Math.round(performance.now() - videoStart), message: "画像和补刀区已完成" });

          const record = {
            id: "generated-" + Date.now(),
            source: "generated",
            parse: structuredCloneData(state.result.parseResult),
            abti: structuredCloneData(state.result.abtiResult),
            profile: structuredCloneData(state.result.profileResult),
            video: structuredCloneData(state.result.videoResult)
          };
          commitRecord(record);
          state.status = "success";
          state.activeStep = "";
          state.sceneIndex = 0;
          window.location.hash = ROUTES.reveal;
          renderApp();
          showToast("模型增强版已生成");
        } catch (error) {
          const message = error instanceof Error ? error.message : "生成失败，请稍后再试";
          if (state.activeStep) updateLog(state.activeStep, { status: "error", message });
          state.status = "error";
          state.errorMessage = message;
          state.activeStep = "";
          renderApp();
        }
      }

      function commitRecord(record) {
        record = hydrateRecord(record);
        state.currentId = record.id;
        if (record.source === "generated") {
          state.history.unshift(record);
          state.history = state.history.slice(0, 10);
        }
        state.result.parseResult = structuredCloneData(record.parse);
        state.result.abtiResult = structuredCloneData(record.abti);
        state.result.profileResult = structuredCloneData(record.profile);
        state.result.videoResult = structuredCloneData(record.video);
      }

      function shiftScene(delta) {
        const record = getCurrentRecord();
        if (!record || !record.video || !record.video.scenes || !record.video.scenes.length) return;
        const total = record.video.scenes.length;
        state.sceneIndex = (state.sceneIndex + delta + total) % total;
        syncRevealScene(record, { animate: true });
        restartSceneLoop(record);
      }

      function jumpScene(nextIndex) {
        const record = getCurrentRecord();
        if (!record || !record.video || !record.video.scenes || !record.video.scenes.length) return;
        if (!Number.isInteger(nextIndex) || nextIndex < 0 || nextIndex >= record.video.scenes.length) return;
        state.sceneIndex = nextIndex;
        syncRevealScene(record, { animate: true });
        restartSceneLoop(record);
      }

      function handleSceneLoop(record) {
        clearSceneLoop();
        if (state.route !== ROUTES.reveal || !record || !record.video || !record.video.scenes.length) return;
        syncRevealScene(record, { animate: false, force: true });
        sceneTimer = setInterval(() => {
          state.sceneIndex = (state.sceneIndex + 1) % record.video.scenes.length;
          syncRevealScene(record, { animate: true });
        }, 2200);
      }

      function restartSceneLoop(record) {
        if (state.route !== ROUTES.reveal) return;
        handleSceneLoop(record);
      }

      function clearSceneLoop() {
        if (sceneTimer) {
          clearInterval(sceneTimer);
          sceneTimer = null;
        }
      }

      function syncRevealScene(record, options) {
        if (state.route !== ROUTES.reveal || !record || !record.video || !record.video.scenes.length) return;
        const settings = options || {};
        const scene = record.video.scenes[Math.min(state.sceneIndex, record.video.scenes.length - 1)] || record.video.scenes[0];
        const title = document.getElementById("videoSceneTitle");
        const caption = document.getElementById("videoSceneCaption");
        const meter = document.getElementById("sceneMeter");
        const body = document.getElementById("videoBody");
        const dots = document.querySelectorAll("[data-scene-dot]");

        if (!title || !caption || !meter || !body || !dots.length) return;

        const sceneKey = record.id + ":" + state.sceneIndex;
        if (!settings.force && body.dataset.sceneKey === sceneKey) return;

        const applyScene = () => {
          body.dataset.sceneKey = sceneKey;
          title.textContent = scene.title;
          caption.textContent = scene.caption;
          meter.textContent = (state.sceneIndex + 1) + " / " + record.video.scenes.length;
          dots.forEach((dot, index) => {
            dot.className = index < state.sceneIndex ? "done" : index === state.sceneIndex ? "active" : "";
          });
        };

        if (!settings.animate) {
          applyScene();
          body.classList.remove("updating");
          return;
        }

        const token = ++sceneTransitionToken;
        body.classList.add("updating");
        requestAnimationFrame(() => {
          if (token !== sceneTransitionToken) return;
          applyScene();
          requestAnimationFrame(() => {
            if (token !== sceneTransitionToken) return;
            body.classList.remove("updating");
          });
        });
      }

      function synthesizeLocalRecord(aSelected, bSelected, forcedId, forcedCode) {
        const parse = deriveParse(aSelected, bSelected);

        const abti = deriveAbti(code, parse);

        const video = deriveVideo(abti, profile, parse);
        return {
          id: forcedId || "local-" + hashString(aSelected.join("|") + "::" + bSelected.join("|")) + "-" + Date.now(),
          source: forcedId ? "sample" : "generated",
          parse,
          abti,
          profile,
          video
        };
      }

        const aWords = aSelected.map(label => A_KEYWORDS.find(item => item.label === label)).filter(Boolean);
        const bWords = bSelected.map(label => B_KEYWORDS.find(item => item.label === label)).filter(Boolean);

        return {

          hidden_engine: "但你真正的发动机是“" + bTop + "”这类毛病：你不是没有底线，你只是上头的时候特别擅长亲手拆自己的底线。",
          social_weapon: aWords.some(item => item.label === "嘴甜" || item.label === "会哄人") ? "你的社交武器是让人先舒服，再让人后知后觉地上钩。" : "你的社交武器是距离感。你不需要靠近太多，别人就会脑补你有多特别。",

        };
      }

      function deriveCode(aSelected, bSelected) {
        const score = { A: 0, V: 0, B: 0, S: 0, T: 0, F: 0, I: 0, R: 0 };
        aSelected.forEach(label => {
          const item = A_KEYWORDS.find(entry => entry.label === label);
          if (!item) return;
          Object.entries(item.score).forEach(([key, value]) => { score[key] += value; });
        });
        bSelected.forEach(label => {
          const item = B_KEYWORDS.find(entry => entry.label === label);
          if (!item) return;
          Object.entries(item.score).forEach(([key, value]) => { score[key] += value; });
        });
        return [score.A >= score.V ? "A" : "V", score.B >= score.S ? "B" : "S", score.T >= score.F ? "T" : "F", score.I >= score.R ? "I" : "R"].join("");
      }

      async function requestStructuredJson(messages, temperature) {
        const response = await fetch(buildChatCompletionUrl(state.apiConfig.baseUrl), {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            Authorization: "Bearer " + state.apiConfig.apiKey.trim()
          },
          body: JSON.stringify({
            model: state.apiConfig.model.trim(),
            messages,
            temperature,
            response_format: { type: "json_object" }
          })
        });
        const raw = await response.text();
        if (!response.ok) throw new Error("接口请求失败（" + response.status + "）：" + raw.slice(0, 220));
        let payload;
        try {
          payload = JSON.parse(raw);
        } catch {
          throw new Error("接口返回的不是有效 JSON");
        }
        const content = payload?.choices?.[0]?.message?.content;
        if (!content) throw new Error("模型没有返回可解析内容");
        return { rawText: content, parsed: JSON.parse(extractJsonString(content)) };
      }

      function buildChatCompletionUrl(baseUrl) {
        const normalized = String(baseUrl || "").trim().replace(/\/+$/, "");
        if (!normalized) throw new Error("请先填写 Base URL");
        return /\/chat\/completions$/i.test(normalized) ? normalized : normalized + "/chat/completions";
      }

      function extractJsonString(content) {
        const match = String(content).match(/```(?:json)?\s*([\s\S]*?)```/i);
        return match && match[1] ? match[1].trim() : String(content).trim();
      }

      function buildPortraitAsset(code, abti, parse) {
        const theme = PORTRAIT_THEMES[code] || { c1: "#e5ba6c", c2: "#9a7dff", c3: "#120d18", accent: "人格事故", aura: "离谱气场", pose: "正面立像" };

      function createPortraitSvg(code, abti, parse, theme) {
        const blueprint = PORTRAIT_BLUEPRINTS[code] || { scene: "mirror", body: "suit", hair: "slick-bob", face: "stoic", prop: "phone", layout: "center-tall", head: "sharp-oval", detail: "earring" };
        const topA = escapeSvg(parse.a_selected[0] || "体面");
        const topB = escapeSvg(parse.b_selected[0] || "嘴硬");
        const typeName = escapeSvg(abti.type_name);
        const meme = escapeSvg(abti.meme_label);
        const accent = escapeSvg(theme.accent);
        const aura = escapeSvg(theme.aura);
        const pose = escapeSvg(theme.pose);
        const codeSafe = escapeSvg(code);
        const layout = getPortraitLayout(blueprint.layout);
        const sceneSvg = buildPortraitScene(blueprint.scene, theme);
        const bodySvg = buildPortraitBody(blueprint.body, theme, layout);
        const headSvg = buildPortraitHead(blueprint.head, theme, layout);

      function buildRevealNarrative(record) {
        return {
          firstLook: record.profile.user_portrait + " " + record.profile.friend_review,
          duality: record.profile.public_mask + " " + record.profile.private_face + " " + record.profile.contrast_twist,
          relationship: record.profile.relationship_hazard + " " + record.profile.self_destruct_mode,
          finalVerdict: record.profile.fatal_scene + " " + record.profile.cursed_talent + " " + record.profile.survival_tip
        };
      }

      function hydrateRecord(record) {
        if (!record || !record.parse) return record;
        const code = record.abti?.code || deriveCode(record.parse.a_selected || [], record.parse.b_selected || []);
        const abti = { ...deriveAbti(code, record.parse), ...(record.abti || {}) };
        const nextProfile = deriveProfile(code, record.parse, abti);
        const profile = { ...nextProfile, ...(record.profile || {}) };
        if (!profile.portrait_url || /^https:\/\/coresg-normal\.trae\.ai\/api\/ide\/v1\/text_to_image/i.test(profile.portrait_url)) {
          profile.portrait_url = nextProfile.portrait_url;
          profile.thumb_url = nextProfile.thumb_url;
          profile.portrait_alt = nextProfile.portrait_alt;
          profile.portrait_prompt = nextProfile.portrait_prompt;
          profile.portrait_caption = profile.portrait_caption || nextProfile.portrait_caption;
        }
        const videoSeed = deriveVideo(abti, profile, record.parse);
        const video = record.video && Array.isArray(record.video.scenes) && record.video.scenes.length ? { ...videoSeed, ...record.video } : videoSeed;
        return { ...record, abti, profile, video };
      }

      function getFactionMeta(code) {
        const key = String(code || "").slice(0, 2);
        return { key, ...(FACTION_META[key] || { label: "人格事故派", desc: "你不是普通难评，你只是暂时还没被分进更精准的危险流派。" }) };
      }

      function hasParseShape(value) {
        return value && Array.isArray(value.a_selected) && Array.isArray(value.b_selected) && value.surface_impression && value.hidden_engine && value.social_weapon && value.crash_trigger;
      }

      function hasAbtiShape(value) {
        return value && value.code && value.type_name && value.bait_title && value.roast_line && value.meme_label && value.kill_shot && value.fuse_statement;
      }

      function hasVideoShape(value) {
        return value && value.profile && value.video && Array.isArray(value.video.scenes) && value.video.scenes.length >= 4;
      }

      async function copyCurrent() {
        const current = getCurrentRecord();
        await navigator.clipboard.writeText(JSON.stringify(current, null, 2));
        showToast("已复制当前 ABTI 结果");
      }

      function stringifyJson(value) {
        return value ? JSON.stringify(value, null, 2) : "暂无结果";
      }

      function showToast(message) {
        toast.textContent = message;
        toast.style.display = "block";
        clearTimeout(showToast.timer);
        showToast.timer = setTimeout(() => {
          toast.style.display = "none";
        }, 1800);
      }

      function shuffle(list) {
        const next = list.slice();
        for (let i = next.length - 1; i > 0; i -= 1) {
          const j = Math.floor(Math.random() * (i + 1));
          const temp = next[i];
          next[i] = next[j];
          next[j] = temp;
        }
        return next;
      }

      function hashString(input) {
        let hash = 0;
        for (let i = 0; i < input.length; i += 1) hash = ((hash << 5) - hash + input.charCodeAt(i)) | 0;
        return Math.abs(hash).toString(36);
      }

      function structuredCloneData(value) {
        return JSON.parse(JSON.stringify(value));
      }

      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#39;");
      }

      function escapeAttr(value) {
        return escapeHtml(String(value || ""));
      }

      function escapeSvg(value) {
        return String(value || "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&apos;");
      }
    })();
